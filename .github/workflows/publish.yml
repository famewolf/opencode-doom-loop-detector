name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install npm (Trusted Publishing requires npm >= 11.5)
        run: npm install --global npm@latest

      - run: bun install
      - run: bun test
      - run: bun run build

      - name: Check the tag matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "${GITHUB_REF_NAME#v}" ]; then
            echo "version mismatch: package.json=$PKG tag=${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Publish to npm (OIDC Trusted Publishing, no token)
        run: |
          if npm view "opencode-doom-loop-detector@$PKG" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "already published: $PKG"
            exit 0
          fi
          npm publish --registry=https://registry.npmjs.org --access public --provenance
        env:
          PKG: ${{ github.ref_name }}

      - name: Create the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
